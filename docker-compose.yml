version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: findback_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findback_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-findback_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findback} -d ${POSTGRES_DB:-findback_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: findback_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findback_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-findback}:${POSTGRES_PASSWORD:-findback_secure_password}@db:5432/${POSTGRES_DB:-findback_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-findback}:${POSTGRES_PASSWORD:-findback_secure_password}@db:5432/${POSTGRES_DB:-findback_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_in_production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: findback_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
